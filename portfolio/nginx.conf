server {
    listen 80;
    server_name _;

    location /bga/ {
        alias /usr/share/nginx/sites/bga/;
        index index.html;
    }

    location /film_dash/ {
        alias /usr/share/nginx/sites/film_dash/;
        index index.html;

        # Luôn revalidate với origin theo Last-Modified/ETag
        # Tránh browser/Cloudflare cache bản cũ (stats.js stale gây lỗi)
        add_header Cache-Control "no-cache";
    }

    location /film_dash/api/ {
        proxy_pass http://film-dash-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        return 404;
    }
}
